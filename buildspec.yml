version: 0.2

backend:
  phases:
    build:
      commands:
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - cd Projects/Build_the_jamstack_site_with_aws
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

env:
  parameter:
    AMPLIFY_MONOREPO_APP_ROOT: Projects/Build_the_jamstack_site_with_aws
